name: Build browser Telegram topics client

on:
  push:
    branches:
      - feature/telegram-topicos-forum-20261114
    paths:
      - 'telegram-client-source.js'
      - '.github/workflows/build-telegram-topics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build MTProto browser bundle
        run: |
          npm install --no-save --no-audit --no-fund teleproto@1.233.0 esbuild@0.25.12
          npx esbuild telegram-client-source.js --bundle --minify --platform=browser --format=iife --target=es2021 --outfile=telegram-client.bundle.js
      - name: Commit browser bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-client.bundle.js
          if ! git diff --cached --quiet; then
            git commit -m "build: Telegram client with forum topics"
            git push origin HEAD:feature/telegram-topicos-forum-20261114
          fi
